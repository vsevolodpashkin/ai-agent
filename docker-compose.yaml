services:
  redis:
    image: redis:7-alpine
    container_name: my_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "SuperSecretPassword123"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "SuperSecretPassword123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  redis_data:
    driver: local